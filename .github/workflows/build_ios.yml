name: Build iOS IPA
on: 
  push:
    branches:
      - NguyenDung831
  workflow_dispatch:
  
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # Cải thiện cách tạo file .env để tránh lỗi xuống dòng
      - name: Create .env file
        run: |
          cat << 'EOF' > .env
          ${{ secrets.ENV_FILE_CONTENT }}
          EOF

      # BƯỚC BỔ SUNG: Bơm key vào file cấu hình native
      - name: Inject keys into native files
        run: make inject-keys

      - name: Create GoogleService-Info.plist
        run: |
          mkdir -p ios/Runner
          cat << 'EOF' > ios/Runner/GoogleService-Info.plist
          ${{ secrets.IOS_FIREBASE_SECRET }}
          EOF

      # BƯỚC BỔ SUNG: Cài đặt CocoaPods cho các thư viện native (Maps, Firebase)
      - name: Install CocoaPods
        run: |
          cd ios
          pod install
          cd ..

      - name: Build iOS (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package into .ipa
        run: |
          mkdir Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -qq -r TrafficHub.ipa Payload

      - name: Upload .ipa file
        uses: actions/upload-artifact@v4
        with:
          name: TrafficHub-IPA
          path: TrafficHub.ipa