name: Build iOS IPA
on: 
  push:
    branches:
      - NguyenDung831
  workflow_dispatch:
  

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # Lấy nội dung từ GitHub Secrets để tạo lại file .env
      - name: Create .env file
        run: echo "${{ secrets.ENV_FILE_CONTENT }}" > .env

      - name: Build iOS (No Codesign)
        run: flutter build ios --release --no-codesign

      # Đóng gói thủ công Runner.app thành file .ipa để Sideloadly nhận diện
      - name: Package into .ipa
        run: |
          mkdir Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -qq -r TrafficHub.ipa Payload

      - name: Upload .ipa file
        uses: actions/upload-artifact@v4
        with:
          name: TrafficHub-IPA
          path: TrafficHub.ipa